name: clock

# Ana saat (v3). GitHub'ın cron'u güvenilmez (25 Eki: fetch cron'u 15 saatte 1 kez ateşlendi);
# eskiden bu işi Mac'teki launchd yapıyordu. Bu workflow ~5 saat 50 dk döner: her 10 dk fetch.yml'i,
# her 30 dk matchcards.yml'i tetikler, bitmeden kendini yeniden başlatır (zincir).
# Zincir koparsa (GitHub kesintisi, elle iptal) saat başı cron ya da "Run workflow" yeniden başlatır;
# zincir dönüyorsa yeni gelen run bunu görüp saniyeler içinde çıkar (ikinci saat dönmez).

on:
  schedule:
    - cron: "7 * * * *"        # yalnızca yeniden başlatıcı
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LOOP_MIN: 350            # toplam döngü (dk); job sınırı 360
    steps:
      - name: tek saat kontrolü
        id: guard
        run: |
          # Benden başka dönen clock var mı? (zincir devri sırasında eski run 1-2 dk daha açık kalabilir → bekle)
          for n in 1 2 3 4 5 6; do
            others=$(gh run list -R "$REPO" -w clock.yml -s in_progress --json databaseId -q '.[].databaseId' | grep -v "^$GITHUB_RUN_ID$" | wc -l)
            [ "$others" -eq 0 ] && break
            echo "başka clock dönüyor ($others), $n/6 bekleniyor"; sleep 30
          done
          if [ "$others" -ne 0 ]; then echo "zincir zaten dönüyor, çıkılıyor"; echo "run=0" >> "$GITHUB_OUTPUT"; else echo "run=1" >> "$GITHUB_OUTPUT"; fi

      - name: loop
        if: steps.guard.outputs.run == '1'
        run: |
          start=$(date +%s); i=0
          fire() { gh workflow run "$1" -R "$REPO" && echo "$(date -u +%H:%M) $1" || echo "$(date -u +%H:%M) $1 TETİKLENEMEDİ"; }
          while [ $(( ($(date +%s) - start) / 60 )) -lt "$LOOP_MIN" ]; do
            now=$(date +%s); sleep $(( 600 - now % 600 ))        # :x0 dakikalarına hizalan
            i=$((i+1))
            fire fetch.yml                                        # :x0 fetch + editoryal (kuyruğa post girerse post.yml'i kendisi tetikler)
            if [ $((i % 3)) -eq 0 ]; then sleep 60; fire matchcards.yml; fi   # :x1, 30 dk'da bir
            sleep 240; fire post.yml                              # :x5 kuyruk boşsa 30 sn'de biter; matchcards kartlarını atar
          done

      - name: restart chain
        if: steps.guard.outputs.run == '1' && always()
        run: |
          gh workflow run clock.yml -R "$REPO" && echo "zincir yenilendi" || echo "ZİNCİR YENİLENEMEDİ — saat başı cron ya da Run workflow yeniden başlatır"
