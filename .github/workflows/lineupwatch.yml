name: lineupwatch

# Kadro bekçisi + canlı maç + otomatik gol kartı (v2, 26 Eki). clock.yml her 10 dk'da bir (:x2) tetikler, ~9,3 dk döner.
# - Maça ≤ 75 dk kala resmî ilk 11'i 2 dk'da bir yoklar (FotMob JSON API + ESPN); görünce matchcards.yml + post.yml'i tetikler.
# - İzlenen takım/oyuncu maçı canlıyken FotMob verisini 20 sn'de bir 'live' dalına yazar.
# - Gol maç başlığında ≥40 sn durunca (VAR güvenliği) gol kartını çizip X'e DOĞRUDAN paylaşır (kullanıcı onayı: gol haberleri onaysız).
#   Türk kulübü / millî takım maçında iki takımın golleri; oyuncu takibinde yalnızca izlenen oyuncunun golü. Kendi kalesine gol paylaşılmaz.
# Ana dala yazmaz (kayıt live dalındaki goals.json'da) → "pipeline" işleriyle çakışmaz.

on:
  workflow_dispatch: {}

concurrency:
  group: lineupwatch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gol kartı çizimi için: runner'daki sistem Chrome'u kullanılır (render_card channel="chrome"); yoksa Chromium kurulur.
      - name: deps
        run: |
          pip -q install requests requests_oauthlib playwright
          if ! command -v google-chrome >/dev/null 2>&1; then python -m playwright install --with-deps chromium; fi

      - name: bekle
        id: w
        env:
          MC_LINEUP_WATCH: "1"
          MC_GOAL_POST: "1"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/matchcards.py

      - name: kart üret + paylaş
        if: steps.w.outputs.ready == '1'
        run: |
          gh workflow run matchcards.yml -R "$REPO"
          sleep 10
          id=$(gh run list -R "$REPO" -w matchcards.yml -L 1 --json databaseId -q '.[0].databaseId')
          echo "matchcards run: $id"
          gh run watch "$id" -R "$REPO" --interval 10 > /dev/null || true
          gh workflow run post.yml -R "$REPO" && echo "post.yml tetiklendi"
