name: photos

# Oyuncu fotoğrafı kesme: private repo assets/card/players_hq_raw/ içine attığın ham fotoğrafların arka planını
# kaldırıp assets/card/players_hq/<ayni-ad>.png olarak yazar. Elle (Run workflow) ya da günde bir kez çalışır.
# Dosya adı: <fotmob id>.jpg ya da ad-soyad.jpg (varyant: ad-soyad_2.jpg). Bkz. players_hq/README.md

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip -q install pillow rembg onnxruntime

      - name: cut
        run: python scripts/cutout.py

      - name: save
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "photos: kesme $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
