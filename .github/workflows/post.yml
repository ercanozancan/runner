name: post

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip -q install requests requests_oauthlib

      # Kuyrukta kartli (card alani olan) bekleyen post var mi? Yoksa Playwright kurma, zaman kaybetme.
      - name: card check
        id: chk
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try: q = json.load(open("queue/approved.json", encoding="utf-8"))
          except Exception: q = []
          need = any(p.get("status") == "pending" and isinstance(p.get("card"), dict) for p in q)
          print(f"need={'true' if need else 'false'}")
          PY

      - name: playwright cache
        if: steps.chk.outputs.need == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1

      - name: playwright
        if: steps.chk.outputs.need == 'true'
        run: |
          pip -q install playwright
          python -m playwright install --with-deps chromium

      - name: run
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/fetch_and_post.py post

      - name: save
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "post: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
