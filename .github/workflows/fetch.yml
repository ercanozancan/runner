name: fetch

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      ed_dry:
        description: "editoryal: 1 = API'yi çağır ama dosya yazma (deneme)"
        default: "0"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  actions: write      # editoryal adım post kuyruğuna yazınca post.yml'i tetikler
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip -q install requests requests_oauthlib

      - name: run
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/fetch_and_post.py fetch

      # Editoryal adım: Mac'teki Claude Code yerine Claude API (Max planı API kredisi).
      # Yeni inbox dosyası yoksa saniyeler içinde biter, API çağrısı yapmaz.
      - name: editorial
        id: ed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ED_MODEL: ${{ vars.ED_MODEL || 'claude-opus-5-5' }}
          ED_DRY: ${{ github.event.inputs.ed_dry || '0' }}
        run: python scripts/editorial.py

      - name: save
        if: ${{ always() }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fetch+editorial: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push

      - name: trigger post
        if: ${{ steps.ed.outputs.new_posts != '' && steps.ed.outputs.new_posts != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml -R "${{ github.repository }}"
